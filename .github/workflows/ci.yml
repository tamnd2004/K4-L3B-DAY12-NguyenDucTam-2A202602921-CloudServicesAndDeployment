# CI/CD: test → build image → deploy Railway (chỉ trên main, chỉ khi 2 job trước xanh)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bỏ test_cp5 (cần bản deploy sống), test bonus (tự kiểm tra badge của
      # chính workflow này) và test build Docker (đã có job build riêng).
      - name: Run tests
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Image size
        run: docker images day12-agent:${{ github.sha }}

      # Chạy thử container với Redis giả trong RAM: /health phải trả 200
      - name: Smoke test /health
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-smoke-test -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Project token tạo ở Railway → Project Settings → Tokens,
      # lưu tại GitHub → Settings → Secrets and variables → Actions
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.63.1

      - name: Deploy
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::Chưa có secret RAILWAY_TOKEN — bỏ qua bước deploy"
            exit 0
          fi
          railway up --service agent --ci
